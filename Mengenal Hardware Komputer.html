<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mengenal Hardware Komputer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d1f;--pn:#0a1a36;--ln:#1b3560;--ac:#1e90ff;--tx:#e8f0ff;--mu:#93a9cc;--ok:#2ecc8f;--no:#ff5c7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 50% 0,#0d2a5a 0,var(--bg) 60%) fixed;color:var(--tx);font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #6cc0ff;outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--ln)}
header h1{margin:0;font-size:20px;font-weight:800}header p{margin:0;color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mu);font-weight:600}
nav button[aria-selected=true]{color:#fff;border-color:var(--ac)}
nav b{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid currentColor;border-radius:50%;font-size:12px;margin-right:6px}
.guru{font-size:12px;color:var(--mu);text-align:right}.guru strong{color:var(--tx);display:block;font-size:13px}
main{padding:18px 22px;max-width:1500px;margin:auto}
.tab{display:none}.tab.on{display:block}
.xp{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:16px}
.pn{background:rgba(10,26,54,.85);border:1px solid var(--ln);border-radius:12px;padding:14px}
.pn h2{margin:0 0 10px;font-size:16px}
#list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
#list button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:7px 8px;text-align:left;font-size:13.5px;color:var(--mu)}
#list img{width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff}
#list button[aria-current=true]{background:linear-gradient(90deg,#1279e0,#0d4c9c);color:#fff;font-weight:600}
.stage{position:relative;padding:8px;display:grid;place-items:center}
.wrap{position:relative;width:100%;max-width:820px}
.wrap>img{width:100%;display:block;border-radius:10px}
.hs{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:rgba(30,144,255,.35);box-shadow:0 0 0 0 rgba(30,144,255,.7);animation:p 2s infinite}
.hs[aria-current=true]{background:#ffc93c;border-color:#ffc93c;animation:none;box-shadow:0 0 0 6px rgba(255,201,60,.3)}
.hs:hover{background:#fff}
@keyframes p{70%{box-shadow:0 0 0 12px rgba(30,144,255,0)}100%{box-shadow:0 0 0 0 rgba(30,144,255,0)}}
.hint{color:var(--mu);font-size:13px;margin:8px 0 0;text-align:center}
.det .bc{color:var(--ac);font-size:12px;margin:0}.det h2{font-size:22px;margin:2px 0}.det .sub{color:var(--mu);margin:0 0 10px}
.det .pic{background:#fff;border-radius:10px;height:170px;display:grid;place-items:center;margin-bottom:12px}
.det .pic img{max-width:90%;max-height:150px;object-fit:contain}
.det h3{font-size:14px;margin:12px 0 4px}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}dt{color:var(--mu)}dd{margin:0}
.fact{background:#0c2247;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px}
.nv{display:flex;gap:10px;margin-top:12px}.nv button{border:1px solid var(--ac);border-radius:999px;background:none;padding:9px 14px}
.nv .nx{flex:1;background:var(--ac);border-color:var(--ac);font-weight:600;color:#fff}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.gr .pn h3{margin:0 0 6px}.gr p{margin:0 0 8px;color:var(--mu)}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--ln);background:#0c2247;border-radius:999px;padding:4px 10px;font-size:12.5px}
.chips button:hover{border-color:var(--ac)}
.q{max-width:720px;margin:auto}.q h2{font-size:18px}
.opt{display:block;width:100%;text-align:left;background:#0c2247;border:1px solid var(--ln);border-radius:10px;padding:11px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#0d3a2e}.opt.no{border-color:var(--no);background:#3a1524}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.pri{background:var(--ac);border:0;border-radius:999px;padding:10px 20px;font-weight:600;color:#fff;margin-top:8px}
.fb{font-size:14px;color:var(--mu);margin:6px 0}
.score{font-size:44px;font-weight:800;margin:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:600}
td:first-child{font-weight:600;white-space:nowrap}
footer{text-align:center;color:var(--mu);font-size:12px;padding:18px}
@media(max-width:1050px){.xp{grid-template-columns:1fr}#list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.guru{text-align:left}}
@media(prefers-reduced-motion:reduce){.hs{animation:none}.bar i{transition:none}}
</style></head><body>

const D=[
['casing','Casing','Rumah bagi semua komponen','Casing melindungi seluruh komponen dari debu, benturan, dan kerusakan fisik. Casing juga membantu sirkulasi udara agar suhu tetap stabil.',[['Material','Steel / ABS plastic'],['Form factor','Mid Tower / Full Tower'],['Motherboard','ATX, Micro-ATX, ITX'],['Kipas','2–6 (tergantung tipe)']],'Casing yang baik menjaga suhu tetap stabil saat gaming atau editing.','Rangka'],
['psu','Power Supply (PSU)','Menyuplai daya ke seluruh komponen','PSU mengubah listrik AC dari stopkontak menjadi arus DC bertegangan rendah (3,3 V, 5 V, 12 V) yang dibutuhkan komponen.',[['Daya','350 W – 1000 W'],['Efisiensi','80 Plus Bronze – Titanium'],['Konektor','24-pin, CPU 8-pin, PCIe, SATA']],'PSU berkualitas rendah dapat merusak komponen lain saat tegangan tidak stabil.','Rangka'],
['mb','Motherboard','Papan utama penghubung semua komponen','Motherboard adalah papan sirkuit tempat CPU, RAM, GPU, dan penyimpanan terhubung dan saling berkomunikasi.',[['Komponen utama','Socket CPU, slot RAM, PCIe, chipset'],['Ukuran','ATX, Micro-ATX, Mini-ITX'],['Port','USB, HDMI, audio, LAN']],'Socket CPU harus cocok dengan prosesor, misalnya LGA1700 untuk Intel generasi 12–14.','Inti pemrosesan'],
['cpu','Processor (CPU)','Otak dari komputer','CPU menjalankan instruksi program dan melakukan perhitungan. Semua perintah dari pengguna diproses di sini.',[['Ukuran kecepatan','GHz (clock speed)'],['Inti','4 – 24 core'],['Contoh','Intel Core i5, AMD Ryzen 5']],'CPU modern bisa menjalankan miliaran instruksi setiap detik.','Inti pemrosesan'],
['ram','RAM','Memori sementara untuk data yang sedang diproses','RAM menyimpan data dan program yang sedang berjalan agar CPU bisa mengaksesnya dengan cepat. Data hilang saat listrik mati (volatile).',[['Kapasitas','4 – 64 GB'],['Tipe','DDR4, DDR5'],['Sifat','Volatile']],'Makin banyak RAM, makin lancar komputer membuka banyak aplikasi sekaligus.','Inti pemrosesan'],
['ssd','SSD','Penyimpanan data berkecepatan tinggi','SSD menyimpan data pada chip memori flash tanpa bagian yang bergerak, sehingga booting dan membuka file jauh lebih cepat dari HDD.',[['Kapasitas','120 GB – 4 TB'],['Antarmuka','SATA, NVMe'],['Kelebihan','Cepat, senyap, tahan guncangan']],'SSD NVMe bisa beberapa kali lebih cepat daripada SSD SATA.','Penyimpanan'],
['hdd','HDD','Penyimpanan data kapasitas besar','HDD menyimpan data pada piringan magnetik yang berputar. Harganya murah per gigabyte, cocok untuk arsip.',[['Kapasitas','500 GB – 20 TB'],['Kecepatan putar','5400 / 7200 RPM'],['Kekurangan','Lebih lambat, ada bagian bergerak']],'HDD lebih rentan rusak jika terkena guncangan saat menyala.','Penyimpanan'],
['gpu','Kartu Grafis (GPU)','Mengolah grafis dan tampilan visual','GPU memproses gambar, video, dan animasi 3D lalu mengirimkannya ke monitor. Penting untuk gaming, desain, dan AI.',[['Memori','VRAM 4 – 24 GB'],['Slot','PCI Express x16'],['Contoh','NVIDIA GeForce RTX']],'Komputer tanpa GPU khusus memakai grafis bawaan (integrated) dari CPU.','Inti pemrosesan'],
['cooler','Pendingin CPU','Menjaga suhu CPU tetap stabil','Heatsink dan kipas memindahkan panas dari CPU ke udara. Tanpa pendingin, CPU cepat panas dan performanya turun (thermal throttling).',[['Tipe','Air cooler / Liquid cooler'],['Bahan','Tembaga dan aluminium'],['Pelengkap','Thermal paste']],'Thermal paste mengisi celah kecil antara CPU dan heatsink agar panas mengalir baik.','Pendingin'],
['fan','Kipas Casing','Mengalirkan udara di dalam casing','Kipas casing memasukkan udara sejuk dan membuang udara panas sehingga suhu semua komponen terjaga.',[['Ukuran','80 / 120 / 140 mm'],['Arah','Depan masuk, belakang keluar'],['Konektor','3-pin / 4-pin']],'Aliran udara yang baik bisa menurunkan suhu komputer beberapa derajat.','Pendingin'],
['monitor','Monitor','Menampilkan hasil proses','Monitor menampilkan gambar dari GPU sehingga pengguna dapat melihat hasil kerja komputer.',[['Ukuran','19 – 32 inci'],['Resolusi','HD, Full HD, 4K'],['Refresh rate','60 – 240 Hz']],'Monitor termasuk perangkat output.','Input & Output'],
['keyboard','Keyboard','Alat input untuk mengetik perintah','Keyboard mengirim huruf, angka, dan perintah ke komputer saat tombol ditekan.',[['Tata letak','QWERTY'],['Tipe','Membran / Mekanik'],['Koneksi','USB / Bluetooth']],'Keyboard mekanik memakai saklar terpisah di bawah setiap tombol.','Input & Output'],
['mouse','Mouse','Alat penunjuk dan navigasi','Mouse menggerakkan kursor dan memilih objek di layar dengan klik dan scroll.',[['Sensor','Optik / Laser'],['Sensitivitas','DPI 800 – 16000'],['Koneksi','USB / Wireless']],'DPI yang tinggi membuat kursor bergerak lebih jauh untuk gerakan tangan yang sama.','Input & Output'],

const HS={casing:[87.5,19.6],psu:[49.7,7],mb:[41.7,34.9],cpu:[55.2,38.2],ram:[66.4,41.6],gpu:[17.3,45.9],ssd:[57.1,76.3],fan:[16.9,23.8]};
const $=s=>document.querySelector(s);let cur=0;
$('#ex').src='data:image/jpeg;base64,'+IMG.exploded;
const src=k=>'data:image/jpeg;base64,'+IMG[k];
const T=['Eksplorasi','Pahami','Kuis','Rangkuman'];
T.forEach((t,i)=>{const b=document.createElement('button');b.setAttribute('role','tab');b.innerHTML='<b>'+(i+1)+'</b>'+t;b.onclick=()=>tab(i);$('#nav').append(b)});
function tab(i){document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',i==j));document.querySelectorAll('#nav button').forEach((e,j)=>e.setAttribute('aria-selected',i==j))}
D.forEach((d,i)=>{const li=document.createElement('li');li.innerHTML=`<button><img alt="" src="${src(d[0])}"><span>${d[1]}</span></button>`;li.firstChild.onclick=()=>sel(i);$('#list').append(li)});
Object.keys(HS).forEach(k=>{const i=D.findIndex(d=>d[0]==k),b=document.createElement('button');b.className='hs';b.dataset.i=i;b.title=D[i][1];b.setAttribute('aria-label',D[i][1]);b.style.left=HS[k][0]+'%';b.style.top=HS[k][1]+'%';b.onclick=()=>sel(i);$('#wrap').append(b)});
function sel(i){cur=(i+D.length)%D.length;const d=D[cur];
document.querySelectorAll('#list button').forEach((b,j)=>b.toggleAttribute('aria-current',j==cur));
document.querySelectorAll('.hs').forEach(b=>b.toggleAttribute('aria-current',+b.dataset.i==cur));
$('#det').innerHTML=`<p class="bc">${d[6]} › Komponen</p><h2>${d[1]}</h2><p class="sub">${d[2]}</p><div class="pic"><img src="${src(d[0])}" alt="${d[1]}"></div><h3>Fungsi</h3><p style="margin:0">${d[3]}</p><h3>Spesifikasi umum</h3><dl>${d[4].map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl><div class="fact"><b>Tahukah kamu?</b><br>${d[5]}</div><div class="nv"><button aria-label="Sebelumnya" id="pv">‹</button><button class="nx" id="nx">Komponen berikutnya ›</button></div>`;
$('#pv').onclick=()=>sel(cur-1);$('#nx').onclick=()=>sel(cur+1)}
sel(0);tab(0);
const G={};D.forEach((d,i)=>(G[d[6]]=G[d[6]]||[]).push(i));
const GD={'Rangka':'Menopang dan memberi daya bagi seluruh sistem.','Inti pemrosesan':'Bekerja sama memproses data: CPU menghitung, RAM menampung, GPU menggambar, motherboard menghubungkan.','Penyimpanan':'Menyimpan data secara permanen. SSD cepat, HDD berkapasitas besar.','Pendingin':'Membuang panas agar komponen tidak overheat.','Input & Output':'Perangkat yang dipakai pengguna: input memasukkan data, output menampilkan hasil.'};
Object.entries(G).forEach(([k,v])=>{const e=document.createElement('div');e.className='pn';e.innerHTML=`<h3>${k}</h3><p>${GD[k]}</p><div class="chips">${v.map(i=>`<button data-i="${i}">${D[i][1]}</button>`).join('')}</div>`;$('#gr').append(e)});
$('#gr').onclick=e=>{const b=e.target.closest('button');if(b){sel(+b.dataset.i);tab(0)}};
$('#sum').innerHTML=D.map(d=>`<tr><td>${d[1]}</td><td>${d[2]}</td><td>${d[6]}</td></tr>`).join('');
const Q=[['Bagian yang disebut otak komputer adalah…',['RAM','Processor (CPU)','Motherboard','PSU'],1],['Komponen yang menyuplai daya ke semua komponen adalah…',['Casing','Kipas casing','Power Supply (PSU)','GPU'],2],['Memori sementara yang datanya hilang saat listrik mati adalah…',['RAM','SSD','HDD','Flash disk'],0],['Penyimpanan tanpa bagian bergerak dan berkecepatan tinggi adalah…',['HDD','SSD','RAM','CPU'],1],['Komponen yang mengolah grafis dan tampilan visual adalah…',['Kartu Grafis (GPU)','PSU','Speaker','Webcam'],0],['Papan utama yang menghubungkan semua komponen adalah…',['Casing','Motherboard','Heatsink','Monitor'],1],['Manakah yang termasuk perangkat input?',['Monitor','Speaker','Webcam','Kipas casing'],2],['Fungsi utama heatsink dan kipas pada CPU adalah…',['Menambah RAM','Menjaga suhu CPU stabil','Menyimpan data','Menampilkan gambar'],1]];
let qi=0,sc=0;
function qr(){const w=$('#quiz');if(qi>=Q.length){w.innerHTML=`<h2>Hasil kuis</h2><p class="score">${Math.round(sc/Q.length*100)}</p><p>Kamu benar ${sc} dari ${Q.length} soal. ${sc>=6?'Bagus! Kamu sudah paham hardware komputer.':'Pelajari lagi tab Eksplorasi, lalu coba ulang.'}</p><button class="pri" id="rs">Ulangi kuis</button>`;$('#rs').onclick=()=>{qi=sc=0;qr()};return}
const q=Q[qi];w.innerHTML=`<div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><p class="fb">Soal ${qi+1} dari ${Q.length}</p><h2>${q[0]}</h2>${q[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}<p class="fb" id="fb"></p>`;
w.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;w.querySelectorAll('.opt').forEach((o,k)=>{o.disabled=true;if(k==q[2])o.classList.add('ok')});if(j==q[2])sc++;else b.classList.add('no');$('#fb').textContent=j==q[2]?'Benar!':'Belum tepat. Jawaban yang benar: '+q[1][q[2]]+'.';const n=document.createElement('button');n.className='pri';n.textContent=qi<Q.length-1?'Soal berikutnya':'Lihat hasil';n.onclick=()=>{qi++;qr()};w.append(n)})}
qr();
</script></body></html>
